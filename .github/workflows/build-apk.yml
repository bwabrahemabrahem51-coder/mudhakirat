name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # [added] only needed for the optional Release step below
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # [added] web/ is the source of truth: copy the site into the Android assets so the APK
      # can never ship an old page. Prints a warning if the two had drifted apart.
      - name: Sync web to app assets
        run: |
          for f in index.html index-sound.html sw.js manifest.json; do
            if ! cmp -s "web/$f" "app/src/main/assets/$f"; then
              echo "::warning::app/src/main/assets/$f differed from web/$f - web/ version was used"
            fi
            cp "web/$f" "app/src/main/assets/$f"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Always: debug-signed APK (installs directly on a phone, no secrets needed)
      - name: Build debug APK
        run: gradle :app:assembleDebug --console=plain

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mudhakirati-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # [added] The "fast" build type (release-like speed, debug-signed so it installs over the old APK).
      # continue-on-error: a problem here can never break the debug APK above.
      - name: Build fast APK
        continue-on-error: true
        run: gradle :app:assembleFast --console=plain

      - name: Upload fast APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mudhakirati-fast-apk
          path: app/build/outputs/apk/fast/*.apk

      # [added] Matches the README ("Releases -> mudhakirati.apk"). Only on a manual "Run workflow",
      # so normal pushes do not create a release each time.
      - name: Publish APK to Releases
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          cp app/build/outputs/apk/fast/*.apk mudhakirati.apk 2>/dev/null || cp app/build/outputs/apk/debug/*.apk mudhakirati.apk
          gh release create "build-${{ github.run_number }}" mudhakirati.apk --title "Build ${{ github.run_number }}" --notes "Automatic build" --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ github.token }}

      # Optional: signed release, only when the 4 secrets exist in the repo
      - name: Check release secrets
        id: sec
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build signed release APK + AAB
        if: steps.sec.outputs.has == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          gradle :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Upload release files
        if: steps.sec.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mudhakirati-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
